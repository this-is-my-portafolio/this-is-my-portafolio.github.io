<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just King — Sitios web para restaurantes y tiendas</title>
  <meta name="description" content="Portafolio de Just King: landings y tiendas online para restaurantes, cafeterías, panaderías, floristerías y comercios. Sitios rápidos, navegables y desplegados." />
  <meta name="theme-color" content="#000000" />

  <meta property="og:title" content="Just King — Sitios web para restaurantes y tiendas" />
  <meta property="og:description" content="Landings y tiendas online para negocios de gastronomía y retail. Trabajos en vivo, no maquetas." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/logo.png" />

  <link rel="icon" type="image/png" href="assets/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/portafolio.css" />
</head>
<body>

  <a class="saltar" href="#detalle">Saltar al proyecto</a>

  <header class="cabecera">
    <a class="cabecera__marca" href="./" aria-label="Just King — inicio">
      <img src="assets/logo.png" alt="" width="28" height="28" />
      <span>JUST<b>KING</b></span>
    </a>
    <p class="cabecera__meta">Restaurantes &amp; tiendas · 2026</p>
  </header>

  <main class="escena">

    <!-- ── Mazo de tarjetas ─────────────────────────────────────────── -->
    <section class="mazo" aria-labelledby="mazo-titulo">
      <h2 id="mazo-titulo" class="visualmente-oculto">Proyectos del portafolio</h2>

      <div class="mazo__escenario">
        <ul class="mazo__pila" id="pila" role="tablist" aria-label="Proyectos">
          <!-- generado por carrusel.js desde js/proyectos.js -->
        </ul>
      </div>

      <div class="mazo__controles">
        <button class="flecha" id="anterior" type="button" aria-label="Proyecto anterior">
          <span aria-hidden="true">&lsaquo;</span>
        </button>

        <p class="contador" id="contador" aria-hidden="true"></p>
        <ul class="puntos" id="puntos" aria-hidden="true"></ul>

        <button class="flecha" id="siguiente" type="button" aria-label="Proyecto siguiente">
          <span aria-hidden="true">&rsaquo;</span>
        </button>
      </div>
    </section>

    <!-- ── Panel de detalle ─────────────────────────────────────────── -->
    <section class="detalle" id="detalle" aria-live="polite" aria-atomic="true">
      <!-- generado por carrusel.js -->
    </section>

  </main>

  <footer class="pie">
    <p class="pie__nota">¿Tu negocio necesita uno así?</p>
    <a class="boton boton--oro" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=justk.service@gmail.com&amp;su=Consulta%20Just%20King" target="_blank" rel="noopener">
      Agendar consulta <span aria-hidden="true">→</span>
    </a>
    <p class="pie__legal">
      Proyectos de demostración con negocios ficticios ·
      <a href="inicio-anterior/">versión anterior del sitio</a>
    </p>
  </footer>

  <script type="module" src="js/carrusel.js"></script>
</body>
</html>
